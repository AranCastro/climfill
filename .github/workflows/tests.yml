name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # [all] adds XGBoost, Streamlit and Plotly so the web-app tests run too
      - name: Install package with all extras (editable)
        run: pip install -e ".[all]"

      - name: Run tests
        run: pytest -v --cov=climfill --cov-report=term-missing
